[project]
name = "ov-cli"
version = "1.0.1"
description = "ov CLI: command line client for the OneVizion API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isfandiyor Baxtiyorov" }]
keywords = ["cli", "onevizion", "api", "openapi", "ppm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28.1",
    "rich>=13.7.0",
    "playwright>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Just-Bax/ov-cli"
Repository = "https://github.com/Just-Bax/ov-cli"
Issues = "https://github.com/Just-Bax/ov-cli/issues"

[project.scripts]
ov = "ov.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ov"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
