[project]
name = "ov-cli"
version = "1.1.0"
description = "ov CLI: command line client for the OneVizion API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Isfandiyor Baxtiyorov" }]
keywords = ["cli", "onevizion", "api", "openapi", "ppm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=42.0.0",
    "filelock>=3.13.0",
    "httpx>=0.28.1",
    "keyring>=25.0.0",
    "rich>=13.7.0",
    "playwright>=1.45.0,<1.63",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Just-Bax/ov-cli"
Repository = "https://github.com/Just-Bax/ov-cli"
Issues = "https://github.com/Just-Bax/ov-cli/issues"

[project.scripts]
ov = "ov.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ov"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90", "PLR09", "TRY", "ARG", "RET"]
ignore = ["PLR0913", "TRY003", "TRY300", "BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
max-statements = 25
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
    "integration: starts servers, runs the CLI end to end, uses git, subprocesses or a browser",
    "browser: drives a real Chromium through Playwright",
]
